<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LearnWise — Build Learning Superpowers</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA manifest & theme -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0D9488">
  <meta name="description" content="AI-powered reading and math practice for students grades K–8.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LearnWise">
  <link rel="apple-touch-icon" href="/icons/icon.svg">

  <!-- MS Tiles -->
  <meta name="msapplication-TileColor" content="#0D9488">
  <meta name="msapplication-TileImage" content="/icons/icon.svg">
</head>
<body>
  <app-root></app-root>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
